[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["pg", "@netlify/database", "js-yaml"]
  included_files = ["node_modules/pg*/**", "node_modules/postgres-*/**", "node_modules/split2/**", "node_modules/xtend/**", "node_modules/@netlify/database/**", "node_modules/@netlify/runtime-utils/**", "node_modules/@neondatabase/serverless/**", "node_modules/waddler/**", "node_modules/ws/**", "node_modules/js-yaml/**", "node_modules/argparse/**"]

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; connect-src 'self'; img-src 'self' data: blob: https://raw.githubusercontent.com https://avatars.githubusercontent.com; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/.netlify/functions/cms-*"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
