# Intended only for an explicitly approved, isolated production release.
# Never use the repository's default wrangler.toml for production: it targets TEST.
name = "polacywbelgii"
pages_build_output_dir = "./_site"
compatibility_date = "2026-10-21"

[vars]
CMS_CONTENT_BACKEND = "d1"
STRIPE_TEST_MODE = "0"
STRIPE_LIVE_ENABLED = "1"
AI_AUTOMATION_ENABLED = "0"
GEMINI_FREE_TIER_CONFIRMED = "0"
AD_SMTP_HOST = "ssl0.ovh.net"
AD_SMTP_USER = "kontakt@polacywbelgii.eu"

[[d1_databases]]
binding = "DB"
database_name = "polacywbelgii-preview"
database_id = "be9435a1-b3ff-41dc-b70d-6f79f768d887"
